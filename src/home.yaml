tagline: >-
  Convert PDF, DjVu, and DOCX into clean Markdown for RAG and LLM pipelines,
  with deterministic repair of converter defects.
# The page title after "raw2md: ", and the heading of the OpenGraph card.
headline: Clean Markdown from PDF, DjVu, and DOCX
install: 'uv tool install --python ">=3.11,<3.15" raw2md --torch-backend cu130'
facts:
  - Python CLI
  - Linux · Windows
  - GPL-3.0-or-later
intro: Overview
