name: Deploy

# The site shows the release that PyPI serves: the build takes the version
# from PyPI and the documents from the tag of that version in raw2md. A
# missing tag fails the checkout, so the site never shows unreleased text.
# raw2md sends the repository_dispatch event after its upload to PyPI.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [raw2md-release]
  workflow_dispatch:

permissions:
  contents: read

# A deploy that started finishes, and the next one waits for it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      # The two trees sit side by side, so the build finds the documents in
      # ../public as it does in a local build.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: site
          persist-credentials: false

      - name: Get the version from PyPI
        id: pypi
        run: |
          version=$(curl -fsSL https://pypi.org/pypi/raw2md/json | jq -er .info.version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "raw2md $version" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: MikeDolg/raw2md
          ref: v${{ steps.pypi.outputs.version }}
          path: public
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      # check:links needs the lychee binary; the checksum pins the download.
      - name: Install lychee
        env:
          LYCHEE_VERSION: 0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          name=lychee-x86_64-unknown-linux-gnu
          curl -fsSLo "$RUNNER_TEMP/lychee.tar.gz" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v$LYCHEE_VERSION/$name.tar.gz"
          echo "$LYCHEE_SHA256  $RUNNER_TEMP/lychee.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      - run: npm ci
      - run: npm run check

      - name: Prepare the IndexNow request
        run: |
          shopt -s nullglob
          keys=(static/*.txt)
          if [ "${#keys[@]}" -ne 1 ]; then
            echo "expected one IndexNow key file in static/, found ${#keys[@]}" >&2
            exit 1
          fi
          key=$(basename "${keys[0]}" .txt)
          mapfile -t urls < <(grep -o '<loc>[^<]*</loc>' dist/sitemap.xml | sed 's/<[^>]*>//g')
          host=$(echo "${urls[0]}" | cut -d/ -f3)
          jq -n --arg host "$host" --arg key "$key" \
            '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: $ARGS.positional}' \
            --args "${urls[@]}" > "$RUNNER_TEMP/indexnow.json"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: indexnow
          path: ${{ runner.temp }}/indexnow.json
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  indexnow:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: indexnow

      # One request reaches every search engine that takes part in IndexNow,
      # Bing and Yandex among them.
      - name: Notify IndexNow
        run: |
          curl -fsS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @indexnow.json
